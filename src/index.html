<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varun's Daily Logs</title>
  <!-- A nicer font from Google Fonts. If there's no internet, the page uses the Mac's own font instead -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Connect the "looks" file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Two cards side by side: the to-do list, and the focus timer -->
  <div class="layout">
  <main class="card">
    <!-- Top: title and today's date on the left, "3 left" bubble on the right -->
    <header class="card-header">
      <div>
        <h1>Varun's Daily Logs</h1>
        <p id="today" class="subtitle"></p>
      </div>
      <span id="counter" class="counter-pill"></span>
    </header>

    <!-- The "add a task" form, in two rows -->
    <form id="task-form">
      <!-- Row 1: type the task, then Add -->
      <div class="form-row">
        <input id="task-input" type="text" placeholder="What's next?" autocomplete="off">
        <button type="submit" class="add-btn">Add</button>
      </div>
      <!-- Row 2: optional due date and time slot (start – end) -->
      <div class="form-row when-row">
        <label class="when-field">
          <span>Due date</span>
          <input id="due-input" type="date">
        </label>
        <div class="when-field slot-field">
          <span>Time slot</span>
          <div class="slot-inputs">
            <input id="slot-start" type="time" aria-label="Slot start time">
            <b>–</b>
            <input id="slot-end" type="time" aria-label="Slot end time">
          </div>
        </div>
      </div>
    </form>

    <!-- Empty list. JavaScript fills it with tasks -->
    <ul id="task-list"></ul>

    <!-- Shown only when there are no tasks at all -->
    <p id="empty-state" class="empty-state">Nothing to do yet. Add a task above! ✈️</p>

    <!-- Bottom row: the Clear done button -->
    <div class="list-footer">
      <button id="clear-done" class="clear-btn" type="button">Clear done tasks</button>
    </div>
  </main>

  <!-- ===== The focus timer card (its "brain" is in timer.js) ===== -->
  <aside id="timer-card" class="card timer-card">
    <h2>Focus timer</h2>
    <p id="focus-label" class="focus-label" hidden>Focusing on <b id="focus-task-name"></b></p>

    <!-- Before starting: scroll wheels for hours, min, sec (timer.js fills these in) -->
    <div id="timer-setup">
      <div id="wheels" class="wheels"></div>
    </div>

    <!-- While running: a ring that shrinks as time runs out, with the countdown inside -->
    <div id="timer-run" class="ring-wrap" hidden>
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="92"></circle>
        <circle id="ring-progress" class="ring-progress" cx="100" cy="100" r="92"></circle>
      </svg>
      <div class="ring-text">
        <span id="timer-time" class="timer-time">25:00</span>
        <span id="timer-ends" class="timer-ends"></span>
      </div>
    </div>

    <!-- Cancel on the left, Start / Pause / Resume on the right (like Apple) -->
    <div class="timer-buttons">
      <button id="timer-cancel" class="round-btn cancel" type="button">Cancel</button>
      <button id="timer-main" class="round-btn start" type="button">Start</button>
    </div>

    <!-- One-tap timers, shown before starting -->
    <div id="timer-quick" class="timer-quick">
      <p class="quick-title">Quick focus</p>
      <div class="chips">
        <button class="chip" data-minutes="25" type="button">🎯 25 min</button>
        <button class="chip" data-minutes="15" type="button">⚡ 15 min</button>
        <button class="chip" data-minutes="5" type="button">☕ 5 min break</button>
      </div>
      <p id="recents-title" class="quick-title" hidden>Recent</p>
      <div id="recents" class="chips"></div>
    </div>
  </aside>
  </div>

  <!-- The pop-up message. Hidden until a task is completed -->
  <div id="toast" class="toast">Smashed it mate</div>

  <!-- Connect the "actions" files (keep these at the bottom, timer.js first) -->
  <script src="timer.js"></script>
  <script src="script.js"></script>
</body>
</html>
