<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varun Dalle</title>
  <!-- A nicer font from Google Fonts. If there's no internet, the page uses the Mac's own font instead -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Connect the "looks" file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- Top: title and today's date on the left, "3 left" bubble on the right -->
    <header class="card-header">
      <div>
        <h1>Varun Dalle</h1>
        <p id="today" class="subtitle"></p>
      </div>
      <span id="counter" class="counter-pill"></span>
    </header>

    <!-- The "add a task" form, in two rows -->
    <form id="task-form">
      <!-- Row 1: type the task, then Add -->
      <div class="form-row">
        <input id="task-input" type="text" placeholder="What's next?" autocomplete="off">
        <button type="submit" class="add-btn">Add</button>
      </div>
      <!-- Row 2: optional due date and time slot (start – end) -->
      <div class="form-row when-row">
        <label class="when-field">
          <span>Due date</span>
          <input id="due-input" type="date">
        </label>
        <div class="when-field slot-field">
          <span>Time slot</span>
          <div class="slot-inputs">
            <input id="slot-start" type="time" aria-label="Slot start time">
            <b>–</b>
            <input id="slot-end" type="time" aria-label="Slot end time">
          </div>
        </div>
      </div>
    </form>

    <!-- Empty list. JavaScript fills it with tasks -->
    <ul id="task-list"></ul>

    <!-- Shown only when there are no tasks at all -->
    <p id="empty-state" class="empty-state">Nothing to do yet. Add a task above! ✈️</p>

    <!-- Bottom row: the Clear done button -->
    <div class="list-footer">
      <button id="clear-done" class="clear-btn" type="button">Clear done tasks</button>
    </div>
  </main>

  <!-- The pop-up message. Hidden until a task is completed -->
  <div id="toast" class="toast">Smashed it mate</div>

  <!-- Connect the "actions" file (keep this at the bottom) -->
  <script src="script.js"></script>
</body>
</html>
