<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varun Dalle</title>
  <!-- Connect the "looks" file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Varun Dalle</h1>
    <p class="subtitle">My to-do list</p>

    <!-- The box where you type a new task, plus the Add button -->
    <form id="task-form">
      <input id="task-input" type="text" placeholder="What do you need to do?" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <!-- Empty list. JavaScript fills it with tasks -->
    <ul id="task-list"></ul>

    <!-- Bottom row: how many tasks are left, plus the Clear done button -->
    <div class="list-footer">
      <p id="counter" class="counter"></p>
      <button id="clear-done" class="clear-btn" type="button">Clear done tasks</button>
    </div>
  </main>

  <!-- The pop-up message. Hidden until a task is completed -->
  <div id="toast" class="toast">Smashed it mate</div>

  <!-- Connect the "actions" file (keep this at the bottom) -->
  <script src="script.js"></script>
</body>
</html>
